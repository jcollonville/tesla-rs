name: ui release

on:
  push:
    tags:
      - "ui-v*"

permissions:
  contents: write

jobs:
  release:
    name: pack and attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: ui
        run: npm ci
      - working-directory: ui
        run: npm test
      - working-directory: ui
        run: npm run build
      - working-directory: ui
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: checksum
        run: cd "$RUNNER_TEMP" && sha256sum jcollonville-tesla-logger-ui-*.tgz > SHA256SUMS
      - name: publish the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/jcollonville-tesla-logger-ui-*.tgz \
            "$RUNNER_TEMP"/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "npm package @jcollonville/tesla-logger-ui. Verify SHA256SUMS before installing the tarball. See ui/README.md."
