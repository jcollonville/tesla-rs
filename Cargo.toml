[workspace]
resolver = "3"
members = [
    "crates/tesla-auth",
    "crates/tesla-owner-api",
    "crates/tesla-fleet-api",
    "crates/tesla-fleet-telemetry",
    "crates/tesla-vehicle-command",
    "examples/list-vehicles",
    "examples/lock-unlock",
    "examples/telemetry-receiver",
    "server",
]
default-members = [
    "crates/tesla-auth",
    "crates/tesla-owner-api",
    "crates/tesla-fleet-api",
    "crates/tesla-fleet-telemetry",
    "crates/tesla-vehicle-command",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Jean Collonvillé"]
repository = "https://github.com/jcollonville/tesla-rs"
homepage = "https://github.com/jcollonville/tesla-rs"

[workspace.dependencies]
base64 = "0.22"
getrandom = "0.2"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tesla-auth = { version = "0.1.0", path = "crates/tesla-auth" }
tesla-owner-api = { version = "0.1.0", path = "crates/tesla-owner-api" }
tesla-fleet-api = { version = "0.1.0", path = "crates/tesla-fleet-api" }
tesla-fleet-telemetry = { version = "0.1.0", path = "crates/tesla-fleet-telemetry" }
tesla-vehicle-command = { version = "0.1.0", path = "crates/tesla-vehicle-command" }
thiserror = "2"
tokio = { version = "1.44", default-features = false }
url = "2"
wiremock = "0.6"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
items_after_statements = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
