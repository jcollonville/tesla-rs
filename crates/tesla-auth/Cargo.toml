[package]
name = "tesla-auth"
description = "OAuth 2.0 for the Tesla Fleet API: authorization code with PKCE, refresh, and partner tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tesla", "oauth", "pkce", "fleet-api", "authentication"]
