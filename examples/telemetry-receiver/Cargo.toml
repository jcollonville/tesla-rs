[package]
name = "telemetry-receiver"
description = "Print decoded Tesla Fleet Telemetry records from a mutual-TLS websocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "telemetry-receiver"
path = "src/main.rs"

[dependencies]
tesla-fleet-telemetry = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
