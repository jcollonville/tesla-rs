openapi: 3.0.3
info:
  title: tesla-logger
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Read API for a self-hosted Tesla drive, charge, and state archive.
    Authenticate with `Authorization: Bearer tl_...`. The token is created in the
    web UI. Distances are kilometres, speeds are km/h, temperatures are Celsius,
    energy is kilowatt-hours, power is kilowatts, tire pressure is bar, charger
    voltage is volts, and charger current is amperes.
servers:
  - url: /
paths:
  /api/v1/vehicles:
    get:
      operationId: listVehicles
      summary: List vehicles and their latest state
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/vehicles/{id}:
    get:
      operationId: getVehicle
      summary: One vehicle
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/vehicles/{id}/state:
    get:
      operationId: getVehicleState
      summary: Current vehicle state
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/drives:
    get:
      operationId: listDrives
      summary: Paginated drives
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/vehicleId" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/perPage" }
      responses:
        "200":
          description: Drive page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrivePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/drives/{id}:
    get:
      operationId: getDrive
      summary: Drive detail with a downsampled route and time series
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - name: max_points
          in: query
          schema: { type: integer, minimum: 2, maximum: 2000, default: 300 }
      responses:
        "200":
          description: Drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriveDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/charges:
    get:
      operationId: listCharges
      summary: Paginated charge sessions
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/vehicleId" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/perPage" }
      responses:
        "200":
          description: Charge page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/charges/{id}:
    get:
      operationId: getCharge
      summary: Charge detail and power curve
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/stats:
    get:
      operationId: getStats
      summary: Drive and charge totals
      security: [{ bearer: [] }]
      parameters:
        - name: vehicle_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/vehicles/{id}/stats/series:
    get:
      operationId: getVehicleStatsSeries
      summary: Drive and charge totals by week, month, or year
      description: |
        One row per bucket, oldest first, including buckets with no trips.
        Boundaries are calendar weeks (Monday), months, or years in `TESLA_TIMEZONE`
        (default Europe/Paris). `count` defaults to 12 weeks, 12 months, or 5 years.
        Drive energy uses `drives.energy_used_kwh` when stored, otherwise rated range
        lost times vehicle efficiency, then ideal range lost times efficiency.
        `charge_cost` uses `charges.cost`, or `energy_added_kwh * ENERGY_PRICE_PER_KWH`
        when cost is null and that variable is set.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/statsPeriod" }
        - { $ref: "#/components/parameters/statsCount" }
      responses:
        "200":
          description: Time series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsSeries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/vehicles/{id}/stats/consumption_by_temp:
    get:
      operationId: getConsumptionByTemp
      summary: Drive consumption by outside temperature over the same window
      description: |
        5°C bins of `drives.outside_temp_avg_c` for drives whose `start_at` falls in
        the selected week, month, or year window. `temp_c_bucket` is the lower edge
        (`floor(temp / 5) * 5`). Empty bins are omitted.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/statsPeriod" }
        - { $ref: "#/components/parameters/statsCount" }
      responses:
        "200":
          description: Temperature bins, coldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsumptionByTemp" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/geofences:
    get:
      operationId: listGeofences
      summary: Geofences
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Geofences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Geofence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/ws:
    get:
      operationId: streamState
      summary: WebSocket push of live state
      description: |
        Send `Authorization: Bearer` or `access_token` query parameter.
        Each text frame is a `VehicleState` plus `type` (`state`), `vin`, and,
        on live updates, `name`, `model`, and `at`. `at` is the observation time.
        The first frames after connect are the stored state of every vehicle.
      security: [{ bearer: [] }]
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    vehicleId:
      name: vehicle_id
      in: query
      schema: { type: integer, format: int64 }
    from:
      name: from
      in: query
      schema: { type: string, format: date-time }
    to:
      name: to
      in: query
      schema: { type: string, format: date-time }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    perPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    statsPeriod:
      name: period
      in: query
      required: true
      schema: { type: string, enum: [week, month, year] }
    statsCount:
      name: count
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 120
        description: Defaults to 12 for week and month, and 5 for year.
  responses:
    Unauthorized:
      description: Missing or revoked token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid query
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Vehicle:
      type: object
      required: [id, vin]
      properties:
        id: { type: integer, format: int64 }
        vin: { type: string }
        name: { type: string, nullable: true }
        model: { type: string, nullable: true }
        exterior_color: { type: string, nullable: true }
        activity: { type: string, nullable: true }
        battery_level: { type: number, nullable: true }
        rated_range_km: { type: number, nullable: true }
        odometer_km: { type: number, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        speed_kmh: { type: number, nullable: true }
        charger_power_kw: { type: number, nullable: true }
        last_poll_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
    VehicleState:
      type: object
      required: [vehicle_id, activity]
      properties:
        vehicle_id: { type: integer, format: int64 }
        activity:
          type: string
          enum: [online, asleep, offline, driving, charging, updating]
        battery_level: { type: number, nullable: true, description: Percent }
        usable_battery_level: { type: number, nullable: true, description: Percent }
        rated_range_km: { type: number, nullable: true, description: Kilometres }
        ideal_range_km: { type: number, nullable: true, description: Kilometres }
        est_range_km: { type: number, nullable: true, description: Kilometres }
        odometer_km: { type: number, nullable: true, description: Kilometres }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        heading_deg: { type: number, nullable: true }
        speed_kmh: { type: number, nullable: true, description: Kilometres per hour }
        power_kw: { type: number, nullable: true, description: Kilowatts }
        inside_temp_c: { type: number, nullable: true, description: Celsius }
        outside_temp_c: { type: number, nullable: true, description: Celsius }
        climate_on: { type: boolean, nullable: true }
        locked: { type: boolean, nullable: true }
        sentry_mode: { type: boolean, nullable: true }
        charger_power_kw: { type: number, nullable: true, description: Kilowatts }
        charging_state: { type: string, nullable: true }
        charge_energy_added_kwh: { type: number, nullable: true, description: Kilowatt-hours }
        charge_limit_soc: { type: number, nullable: true, description: Percent }
        shift_state: { type: string, nullable: true }
        is_dc: { type: boolean, nullable: true }
        software_version: { type: string, nullable: true }
        update_status: { type: string, nullable: true }
        last_poll_at: { type: string, format: date-time, nullable: true }
        last_data_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        stream_status:
          type: string
          enum: [connected, disabled, error]
          description: >
            Owner API streaming socket. disabled when streaming is not configured
            or OWNER_STREAM_ENABLED is false. The legacy streaming endpoint is
            unofficial and may disappear. Fleet API polling continues either way.
        stream_error:
          type: string
          nullable: true
          description: Short error class when stream_status is error. Tokens are never included.
        position_mode:
          type: string
          enum: [hybrid, fallback]
          description: >
            hybrid while Owner stream data:update frames supply drive GPS and
            vehicle_data supplies the other status fields. fallback when the
            socket is down or silent during a drive; GPS positions then come
            from vehicle_data every POLL_GPS_FALLBACK_SECS. Asleep cars are not
            woken for either mode.
        charger_voltage: { type: number, nullable: true, description: Volts }
        charger_current:
          type: number
          nullable: true
          description: Amperes. Fleet API charger_actual_current.
        charge_current_request: { type: number, nullable: true, description: Amperes }
        charge_port_door_open: { type: boolean, nullable: true }
        charge_port_latch:
          type: string
          nullable: true
          description: Engaged, Disengaged, or Blocking
        plugged_in:
          type: boolean
          nullable: true
          description: Derived from charge_port_latch, charging_state, and conn_charge_cable
        time_to_full_charge_h: { type: number, nullable: true, description: Hours }
        scheduled_charging_start_time:
          type: integer
          nullable: true
          description: Minutes after midnight, as reported by the vehicle
        tpms_pressure_fl: { type: number, nullable: true, description: Bar }
        tpms_pressure_fr: { type: number, nullable: true, description: Bar }
        tpms_pressure_rl: { type: number, nullable: true, description: Bar }
        tpms_pressure_rr: { type: number, nullable: true, description: Bar }
        df: { type: integer, nullable: true, description: Driver front door. 0 is closed, nonzero is open }
        dr: { type: integer, nullable: true, description: Driver rear door. 0 is closed, nonzero is open }
        pf: { type: integer, nullable: true, description: Passenger front door. 0 is closed, nonzero is open }
        pr: { type: integer, nullable: true, description: Passenger rear door. 0 is closed, nonzero is open }
        fd_window: { type: integer, nullable: true, description: Driver front window. 0 is closed, nonzero is open }
        fp_window: { type: integer, nullable: true, description: Passenger front window. 0 is closed, nonzero is open }
        rd_window: { type: integer, nullable: true, description: Driver rear window. 0 is closed, nonzero is open }
        rp_window: { type: integer, nullable: true, description: Passenger rear window. 0 is closed, nonzero is open }
        ft: { type: integer, nullable: true, description: Front trunk. 0 is closed, nonzero is open }
        rt: { type: integer, nullable: true, description: Rear trunk. 0 is closed, nonzero is open }
        is_user_present: { type: boolean, nullable: true }
        elevation_m: { type: number, nullable: true, description: Metres }
        battery_heater_on: { type: boolean, nullable: true }
        is_preconditioning: { type: boolean, nullable: true }
    Drive:
      type: object
      required: [id, vehicle_id, start_at]
      properties:
        id: { type: integer, format: int64 }
        vehicle_id: { type: integer, format: int64 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, nullable: true }
        distance_km: { type: number, nullable: true }
        duration_s: { type: integer, nullable: true }
        energy_used_kwh: { type: number, nullable: true }
        max_speed_kmh: { type: number, nullable: true }
        avg_speed_kmh: { type: number, nullable: true }
        elevation_gain_m: { type: number, nullable: true }
        elevation_loss_m: { type: number, nullable: true }
        start_latitude: { type: number, nullable: true }
        start_longitude: { type: number, nullable: true }
        end_latitude: { type: number, nullable: true }
        end_longitude: { type: number, nullable: true }
    DrivePage:
      type: object
      required: [data, page, per_page, total]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Drive" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
    RoutePoint:
      type: object
      required: [recorded_at, latitude, longitude]
      properties:
        recorded_at: { type: string, format: date-time }
        latitude: { type: number }
        longitude: { type: number }
    SeriesPoint:
      type: object
      required: [recorded_at]
      properties:
        recorded_at: { type: string, format: date-time }
        speed_kmh: { type: number, nullable: true }
        power_kw: { type: number, nullable: true }
        battery_level: { type: number, nullable: true }
        elevation_m: { type: number, nullable: true }
        rated_range_km: { type: number, nullable: true }
        odometer_km: { type: number, nullable: true }
    DriveDetail:
      allOf:
        - { $ref: "#/components/schemas/Drive" }
        - type: object
          required: [route, series]
          properties:
            route:
              type: array
              items: { $ref: "#/components/schemas/RoutePoint" }
            series:
              type: array
              items: { $ref: "#/components/schemas/SeriesPoint" }
    Charge:
      type: object
      required: [id, vehicle_id, start_at]
      properties:
        id: { type: integer, format: int64 }
        vehicle_id: { type: integer, format: int64 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, nullable: true }
        energy_added_kwh: { type: number, nullable: true }
        energy_used_kwh: { type: number, nullable: true }
        is_dc: { type: boolean, nullable: true }
        charger_type: { type: string, nullable: true }
        max_power_kw: { type: number, nullable: true }
        duration_s: { type: integer, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        cost: { type: number, nullable: true }
    ChargePage:
      type: object
      required: [data, page, per_page, total]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Charge" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
    ChargeSample:
      type: object
      required: [recorded_at]
      properties:
        recorded_at: { type: string, format: date-time }
        battery_level: { type: number, nullable: true }
        charger_power_kw: { type: number, nullable: true }
        charger_voltage: { type: number, nullable: true }
        charger_current: { type: number, nullable: true }
        charge_energy_added_kwh: { type: number, nullable: true }
    ChargeDetail:
      allOf:
        - { $ref: "#/components/schemas/Charge" }
        - type: object
          required: [samples]
          properties:
            samples:
              type: array
              items: { $ref: "#/components/schemas/ChargeSample" }
    Stats:
      type: object
      required: [vehicle_id, drive_count, distance_km, drive_duration_s, energy_used_kwh, charge_count, energy_added_kwh]
      properties:
        vehicle_id: { type: integer, format: int64 }
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
        drive_count: { type: integer, format: int64 }
        distance_km: { type: number }
        drive_duration_s: { type: integer, format: int64 }
        energy_used_kwh: { type: number }
        charge_count: { type: integer, format: int64 }
        energy_added_kwh: { type: number }
    StatsSeries:
      type: object
      required: [period, buckets]
      properties:
        period: { type: string, enum: [week, month, year] }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/StatsBucket" }
    StatsBucket:
      type: object
      required:
        - start
        - distance_km
        - energy_used_kwh
        - wh_per_km
        - energy_charged_kwh
        - drive_duration_s
        - drive_count
        - range_at_100_km
        - ac_energy_kwh
        - dc_energy_kwh
        - dc_share_pct
        - charge_cost
        - cost_per_km
        - idle_range_loss_km_per_day
        - idle_energy_loss_kwh_per_day
      properties:
        start:
          type: string
          format: date-time
          description: Bucket start in the configured timezone, with its UTC offset
          example: "2026-11-01T00:00:00+01:00"
        distance_km: { type: number, description: Sum of drives.distance_km }
        energy_used_kwh:
          type: number
          nullable: true
          description: Sum of drive consumption. 0 when the bucket has no drives
        wh_per_km:
          type: number
          nullable: true
          description: energy_used_kwh * 1000 / distance_km when distance is positive
        energy_charged_kwh: { type: number, description: Sum of charges.energy_added_kwh }
        drive_duration_s: { type: integer, format: int64 }
        drive_count: { type: integer, format: int64 }
        range_at_100_km:
          type: number
          nullable: true
          description: >
            Average of rated_range_km / battery_level * 100 over positions, charge
            samples, and charge endpoints in the bucket. Samples at or below 10%
            or above 100% state of charge are ignored.
        ac_energy_kwh: { type: number, description: Energy added on AC charges }
        dc_energy_kwh: { type: number, description: Energy added on DC fast charges }
        dc_share_pct:
          type: number
          nullable: true
          description: DC energy as a percent of AC plus DC. Null when no energy was added
        charge_cost:
          type: number
          nullable: true
          description: Sum of known charge costs. Null when none can be priced
        cost_per_km:
          type: number
          nullable: true
          description: charge_cost / distance_km when both exist
        idle_range_loss_km_per_day:
          type: number
          nullable: true
          description: >
            Rated range lost between the end of one closed drive or charge and the
            start of the next, per parked day. The car must not have moved a kilometre
            or more. Null when the bucket has no such parked time.
        idle_energy_loss_kwh_per_day:
          type: number
          nullable: true
          description: idle_range_loss_km_per_day times vehicle efficiency
    ConsumptionByTemp:
      type: object
      required: [temp_c_bucket, wh_per_km, distance_km]
      properties:
        temp_c_bucket: { type: integer, description: Lower edge of a 5°C bin, in Celsius }
        wh_per_km: { type: number, nullable: true }
        distance_km: { type: number }
    Geofence:
      type: object
      required: [id, name, latitude, longitude, radius_m]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: number }
        billing_type: { type: string, nullable: true }
        cost_per_unit: { type: number, nullable: true }
        session_fee: { type: number, nullable: true }
