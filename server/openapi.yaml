openapi: 3.0.3
info:
  title: tesla-logger
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Read API for a self-hosted Tesla drive, charge, and state archive.
    Authenticate with `Authorization: Bearer tl_...`. The token is created in the
    web UI. Distances are kilometres, speeds are km/h, temperatures are Celsius,
    and energy is kilowatt-hours.
servers:
  - url: /
paths:
  /api/v1/vehicles:
    get:
      operationId: listVehicles
      summary: List vehicles and their latest state
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/vehicles/{id}:
    get:
      operationId: getVehicle
      summary: One vehicle
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/vehicles/{id}/state:
    get:
      operationId: getVehicleState
      summary: Current vehicle state
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/drives:
    get:
      operationId: listDrives
      summary: Paginated drives
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/vehicleId" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/perPage" }
      responses:
        "200":
          description: Drive page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrivePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/drives/{id}:
    get:
      operationId: getDrive
      summary: Drive detail with a downsampled route and time series
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - name: max_points
          in: query
          schema: { type: integer, minimum: 2, maximum: 2000, default: 300 }
      responses:
        "200":
          description: Drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriveDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/charges:
    get:
      operationId: listCharges
      summary: Paginated charge sessions
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/vehicleId" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/perPage" }
      responses:
        "200":
          description: Charge page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/charges/{id}:
    get:
      operationId: getCharge
      summary: Charge detail and power curve
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/stats:
    get:
      operationId: getStats
      summary: Drive and charge totals
      security: [{ bearer: [] }]
      parameters:
        - name: vehicle_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/geofences:
    get:
      operationId: listGeofences
      summary: Geofences
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Geofences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Geofence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/ws:
    get:
      operationId: streamState
      summary: WebSocket push of live state
      description: |
        Send `Authorization: Bearer` or `access_token` query parameter.
        Each text frame is a state object with `type` equal to `state`.
      security: [{ bearer: [] }]
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    vehicleId:
      name: vehicle_id
      in: query
      schema: { type: integer, format: int64 }
    from:
      name: from
      in: query
      schema: { type: string, format: date-time }
    to:
      name: to
      in: query
      schema: { type: string, format: date-time }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    perPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Unauthorized:
      description: Missing or revoked token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid query
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Vehicle:
      type: object
      required: [id, vin]
      properties:
        id: { type: integer, format: int64 }
        vin: { type: string }
        name: { type: string, nullable: true }
        model: { type: string, nullable: true }
        exterior_color: { type: string, nullable: true }
        activity: { type: string, nullable: true }
        battery_level: { type: number, nullable: true }
        rated_range_km: { type: number, nullable: true }
        odometer_km: { type: number, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        speed_kmh: { type: number, nullable: true }
        charger_power_kw: { type: number, nullable: true }
        last_poll_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
    VehicleState:
      type: object
      required: [vehicle_id, activity]
      properties:
        vehicle_id: { type: integer, format: int64 }
        activity:
          type: string
          enum: [online, asleep, offline, driving, charging, updating]
        battery_level: { type: number, nullable: true }
        rated_range_km: { type: number, nullable: true }
        odometer_km: { type: number, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        speed_kmh: { type: number, nullable: true }
        charger_power_kw: { type: number, nullable: true }
        charging_state: { type: string, nullable: true }
        shift_state: { type: string, nullable: true }
        last_poll_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
    Drive:
      type: object
      required: [id, vehicle_id, start_at]
      properties:
        id: { type: integer, format: int64 }
        vehicle_id: { type: integer, format: int64 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, nullable: true }
        distance_km: { type: number, nullable: true }
        duration_s: { type: integer, nullable: true }
        energy_used_kwh: { type: number, nullable: true }
        max_speed_kmh: { type: number, nullable: true }
        avg_speed_kmh: { type: number, nullable: true }
        elevation_gain_m: { type: number, nullable: true }
        elevation_loss_m: { type: number, nullable: true }
        start_latitude: { type: number, nullable: true }
        start_longitude: { type: number, nullable: true }
        end_latitude: { type: number, nullable: true }
        end_longitude: { type: number, nullable: true }
    DrivePage:
      type: object
      required: [data, page, per_page, total]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Drive" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
    RoutePoint:
      type: object
      required: [recorded_at, latitude, longitude]
      properties:
        recorded_at: { type: string, format: date-time }
        latitude: { type: number }
        longitude: { type: number }
    SeriesPoint:
      type: object
      required: [recorded_at]
      properties:
        recorded_at: { type: string, format: date-time }
        speed_kmh: { type: number, nullable: true }
        power_kw: { type: number, nullable: true }
        battery_level: { type: number, nullable: true }
        elevation_m: { type: number, nullable: true }
        rated_range_km: { type: number, nullable: true }
        odometer_km: { type: number, nullable: true }
    DriveDetail:
      allOf:
        - { $ref: "#/components/schemas/Drive" }
        - type: object
          required: [route, series]
          properties:
            route:
              type: array
              items: { $ref: "#/components/schemas/RoutePoint" }
            series:
              type: array
              items: { $ref: "#/components/schemas/SeriesPoint" }
    Charge:
      type: object
      required: [id, vehicle_id, start_at]
      properties:
        id: { type: integer, format: int64 }
        vehicle_id: { type: integer, format: int64 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, nullable: true }
        energy_added_kwh: { type: number, nullable: true }
        energy_used_kwh: { type: number, nullable: true }
        is_dc: { type: boolean, nullable: true }
        charger_type: { type: string, nullable: true }
        max_power_kw: { type: number, nullable: true }
        duration_s: { type: integer, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        cost: { type: number, nullable: true }
    ChargePage:
      type: object
      required: [data, page, per_page, total]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Charge" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
    ChargeSample:
      type: object
      required: [recorded_at]
      properties:
        recorded_at: { type: string, format: date-time }
        battery_level: { type: number, nullable: true }
        charger_power_kw: { type: number, nullable: true }
        charger_voltage: { type: number, nullable: true }
        charger_current: { type: number, nullable: true }
        charge_energy_added_kwh: { type: number, nullable: true }
    ChargeDetail:
      allOf:
        - { $ref: "#/components/schemas/Charge" }
        - type: object
          required: [samples]
          properties:
            samples:
              type: array
              items: { $ref: "#/components/schemas/ChargeSample" }
    Stats:
      type: object
      required: [vehicle_id, drive_count, distance_km, drive_duration_s, energy_used_kwh, charge_count, energy_added_kwh]
      properties:
        vehicle_id: { type: integer, format: int64 }
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
        drive_count: { type: integer, format: int64 }
        distance_km: { type: number }
        drive_duration_s: { type: integer, format: int64 }
        energy_used_kwh: { type: number }
        charge_count: { type: integer, format: int64 }
        energy_added_kwh: { type: number }
    Geofence:
      type: object
      required: [id, name, latitude, longitude, radius_m]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: number }
        billing_type: { type: string, nullable: true }
        cost_per_unit: { type: number, nullable: true }
        session_fee: { type: number, nullable: true }
